[observer]
code = "TST01"
name = "Your Name"
software = "autometrics 0.1.0"
latitude = 0.0
longitude = 0.0
elevation_m = 0.0

[instrument]
gain_e_per_adu = 1.0
read_noise_e = 5.0
saturation_adu = 60000.0
pixel_scale_arcsec = 1.5
filter = "V"

[astrometry]
solve_field = "solve-field"
index_path = ""
radius_arcmin = 30.0

[photometry]
fwhm_pixels = 4.0
aperture_fwhm = 1.8
annulus_inner_fwhm = 3.0
annulus_outer_fwhm = 5.0
match_radius_arcsec = 3.0
min_snr = 10.0

[processing]
dark_tolerance_seconds = 5.0
workers = 1
